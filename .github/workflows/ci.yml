name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workspace:
    name: workspace-foundation
    runs-on: ubuntu-latest
    # Root `npm ci` installs pos-electron's `electron` dependency too, whose
    # postinstall downloads a ~100MB platform binary over the network. This
    # job never touches Electron, so that download is pure failure surface
    # (see admin's run 32367936824, `TypeError: fetch failed` from
    # @electron/get) with no coverage behind it -- skip it here.
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:workspace
      - run: npm run workspace:validate
      - run: npm run test:shared

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/bold
      DIRECT_URL: postgresql://user:password@localhost:5432/bold
      JWT_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
      # See workspace job above: this job never touches Electron.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: ${{ github.workspace }}
      - run: npx prisma validate
      - run: npm run test:soft
      - run: npm audit --audit-level=high
      - name: Build production API container from the workspace root
        run: docker build --file backend/Dockerfile --tag athr-api:${{ github.sha }} .
        working-directory: ${{ github.workspace }}

  migration-gate:
    name: migration-gate
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: athr_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d athr_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
      ALLOW_DEVELOPMENT_ACCOUNTING_RESET: reset-development-accounting
      ALLOW_REMOTE_DEVELOPMENT_ACCOUNTING_RESET: 1
      # See workspace job above: this job never touches Electron. Applies to
      # both `npm ci` invocations below, including the one against the
      # release-baseline checkout in migration-base/.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: ${{ github.workspace }}
      - name: Create isolated migration databases
        env:
          PGPASSWORD: postgres
        run: |
          for database in \
            athr_migrations_clean \
            athr_migrations_clean_shadow \
            athr_migrations_upgrade \
            athr_migrations_upgrade_shadow
          do
            createdb \
              --host localhost \
              --username postgres \
              "$database"
          done
      - name: Resolve exact migration baselines
        id: refs
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base_sha="$EVENT_BASE_SHA"
          if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
      - name: Enforce immutable forward-only migrations
        id: policy
        run: >-
          npm run prisma:migrations:policy --
          --base "${{ steps.refs.outputs.base_sha }}"
          --github-output "$GITHUB_OUTPUT"
      - name: Apply current migrations to a clean database twice
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/athr_migrations_clean
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/athr_migrations_clean
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/athr_migrations_clean_shadow
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npx prisma migrate deploy
          npx prisma migrate status
          npx prisma migrate diff --exit-code \
            --from-migrations prisma/migrations \
            --to-url "$DIRECT_URL" \
            --shadow-database-url "$SHADOW_DATABASE_URL"
      - name: Verify tenant database constraints (WP-007 Phase B)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/athr_migrations_clean
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/athr_migrations_clean
        run: node scripts/verify-tenant-constraints.cjs
      # WP-008 Phase B: POS sync emission, default-Price-Book replacement and
      # the PricingRule tie-break are all enforced by the database, not by
      # application code -- they can only be proven against a real one.
      - name: Verify Price Book behaviour (WP-008 Phase B)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/athr_migrations_clean
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/athr_migrations_clean
        run: node scripts/verify-price-book-behaviour.cjs
      # WP-008 Phase C: tax snapshot immutability, the one-active-code partial
      # index, activate's demote-before-promote statement order and SyncChange
      # emission are all enforced by the database. fakePrisma runs no trigger
      # and enforces no partial index, so a green jest suite proves none of
      # them -- this is where the phase's central test actually runs.
      - name: Verify Tax Code behaviour (WP-008 Phase C)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/athr_migrations_clean
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/athr_migrations_clean
        run: node scripts/verify-tax-code-behaviour.cjs
      # WP-008 Phase D: Coupon code uniqueness (BR-CPN-201) and idempotent
      # redemption (BR-CPN-204) are both unique-constraint invariants proven
      # under genuine concurrency (Promise.all racing writers on the same
      # row), not sequential calls -- fakePrisma enforces no unique
      # constraint at all (backlog item F7c), so a green jest suite proves
      # neither. This is where that phase's central tests actually run.
      - name: Verify Promotion/Coupon behaviour (WP-008 Phase D)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/athr_migrations_clean
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/athr_migrations_clean
        run: node scripts/verify-promotion-behaviour.cjs
      # hard-load stack-depth fix: SyncService's catalog snapshot used
      # Prisma's automatic include:{product:true} relation loader, which
      # exceeds Postgres's max_stack_depth once the parent ProductVariant
      # set is unbounded and large (confirmed between 7,500 and 10,031
      # rows). fakePrisma runs no real query planner/executor, so this only
      # reproduces against a real database. This proof asserts on
      # SyncService itself rather than a reimplementation of its query
      # shape, so it needs the compiled service.
      - name: Build backend for the sync snapshot proof
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/athr_migrations_clean
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/athr_migrations_clean
        run: npm run build
      - name: Verify sync snapshot behaviour at catalog volume
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/athr_migrations_clean
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/athr_migrations_clean
        run: node scripts/verify-sync-snapshot-behaviour.cjs
      # WP-T2/F4: fakePrisma's $queryRaw/$executeRaw now fail loud on any
      # statement not on the declared allowlist (raw-sql-allowlist.ts) --
      # every remaining raw-SQL path a jest spec only proved by asserting on
      # captured SQL text (not by executing it) still needs a real proof.
      # Reuses the dist/ build from the step above.
      - name: Verify raw-SQL tenant scoping (WP-T2/F4)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/athr_migrations_clean
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/athr_migrations_clean
        run: node scripts/verify-raw-sql-tenant-scoping.cjs
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.policy.outputs.upgrade_ref }}
          path: migration-base
      - name: Build a populated database from the release baseline
        working-directory: migration-base
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/athr_migrations_upgrade
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/athr_migrations_upgrade
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm ci --prefix backend
          fi
          cd backend
          npx prisma generate
          npx prisma migrate deploy
          npm run prisma:seed
      - name: Upgrade populated release data with current migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/athr_migrations_upgrade
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/athr_migrations_upgrade
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/athr_migrations_upgrade_shadow
        run: |
          npx prisma generate
          # WP-008 Phase B / CLAUDE.md §6 "fail loud on ambiguous data": the
          # PricingRule -> PriceBook cutover's accounting. The migration's own
          # RAISE NOTICE is invisible (`prisma migrate deploy` does not print
          # PostgreSQL NOTICE messages), so the standalone validator runs here
          # instead -- pre-migration for the ambiguous-row report, and
          # post-migration for the hard 1:1 "no live variant lost its price"
          # invariant, which exits non-zero and fails this job.
          node scripts/validate-pricing-rule-migration.cjs
          node scripts/validate-tax-code-migration.cjs
          npx prisma migrate deploy
          npx prisma migrate deploy
          npx prisma migrate status
          node scripts/validate-pricing-rule-migration.cjs --post-check
          node scripts/validate-tax-code-migration.cjs --post-check
          npx prisma migrate diff --exit-code \
            --from-migrations prisma/migrations \
            --to-url "$DIRECT_URL" \
            --shadow-database-url "$SHADOW_DATABASE_URL"

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    # See workspace job above: this job never touches Electron. This is the
    # job from admin's run 32367936824 that actually hit the transient
    # `TypeError: fetch failed` and failed release-gate as a consequence.
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: ${{ github.workspace }}
      - run: npm run test:soft
      - run: npm audit --audit-level=high

  admin-e2e-smoke:
    name: admin-e2e-smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: athr_admin_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d athr_admin_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/athr_admin_smoke
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/athr_admin_smoke
      JWT_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
      ALLOW_DEVELOPMENT_ACCOUNTING_RESET: reset-development-accounting
      ATHR_API_INTERNAL_BASE: http://localhost:3000/api/v1
      ADMIN_SMOKE_PHONE: "+200100000000"
      ADMIN_SMOKE_PASSWORD: Bold1234
      # See workspace job above: this job never touches Electron.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: ${{ github.workspace }}
      - run: npx prisma migrate deploy
        working-directory: backend
      - run: npm run prisma:seed
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: npm run build
        working-directory: admin-web
      - name: Start Backend and Admin
        run: |
          npm --prefix backend run start:prod > /tmp/athr-api.log 2>&1 &
          npm --prefix admin-web run start > /tmp/athr-admin.log 2>&1 &
          for attempt in {1..30}; do
            curl --silent --fail http://localhost:3000/api/v1/health/ready >/dev/null \
              && curl --silent --fail http://localhost:3001/login >/dev/null \
              && exit 0
            sleep 1
          done
          cat /tmp/athr-api.log
          cat /tmp/athr-admin.log
          exit 1
      - run: npm run test:e2e:smoke
        working-directory: admin-web

  pos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos-electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: ${{ github.workspace }}
      - run: npm run test:soft
      - run: npm audit --audit-level=high

  hard-smoke:
    needs: migration-gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: athr_perf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d athr_perf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/athr_perf
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/athr_perf
      JWT_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
      ALLOW_DEVELOPMENT_ACCOUNTING_RESET: reset-development-accounting
      PERF_LOGIN_PHONE: "+200100000000"
      PERF_LOGIN_PASSWORD: Bold1234
      PERF_SMOKE: 1
      PERF_MUTATIONS: 1
      PERF_SALES: 2
      # See workspace job above: this job never touches Electron.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: ${{ github.workspace }}
      - run: npx prisma migrate deploy
      - run: npm run prisma:seed
      - run: npm run build
      - name: Start API
        run: |
          npm run start:prod > /tmp/athr-api.log 2>&1 &
          for attempt in {1..30}; do
            curl --silent --fail http://localhost:3000/api/v1/health/ready >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/athr-api.log
          exit 1
      # Reaching a healthy /health/ready already proves SwaggerModule.createDocument
      # (backend/src/main.ts:61-62 runs before app.listen) and the eager
      # `require("js-yaml")` at the top of @nestjs/swagger's swagger-module.js.
      # It does NOT prove the serializer: jsyaml.dump() runs only inside the
      # GET /api/docs-yaml handler. Without this step nothing in CI ever executes
      # it, so a bad js-yaml resolution would ship green.
      - name: Prove Swagger document generation, including the js-yaml YAML path
        run: |
          set -euo pipefail
          curl --silent --fail http://localhost:3000/api/docs-json > /tmp/athr-openapi.json
          curl --silent --fail http://localhost:3000/api/docs-yaml > /tmp/athr-openapi.yaml
          node -e "
            const path = require('node:path');
            const { readFileSync } = require('node:fs');
            // Resolve js-yaml the way @nestjs/swagger itself does, from its own
            // directory, rather than by bare require(). js-yaml is not a declared
            // backend dependency, so a bare require() depends on it staying hoisted
            // -- and re-resolution moving it is the exact scenario this step guards.
            // Going through swagger's own directory also means we assert against the
            // overridden copy it actually loads.
            const swaggerDir = path.dirname(require.resolve('@nestjs/swagger'));
            const yaml = require(require.resolve('js-yaml', { paths: [swaggerDir] }));
            const json = JSON.parse(readFileSync('/tmp/athr-openapi.json', 'utf8'));
            const document = yaml.load(readFileSync('/tmp/athr-openapi.yaml', 'utf8'));
            const jsonPaths = Object.keys(json.paths || {});
            const yamlPaths = Object.keys(document.paths || {});
            if (!json.openapi || jsonPaths.length === 0) {
              throw new Error('OpenAPI JSON document is empty');
            }
            if (document.openapi !== json.openapi) {
              throw new Error('YAML document does not match the JSON document');
            }
            if (yamlPaths.length !== jsonPaths.length) {
              throw new Error(
                'YAML exposes ' + yamlPaths.length + ' paths, JSON exposes ' + jsonPaths.length
              );
            }
            // Resolve the manifest directly. js-yaml's main entry lives in dist/,
            // so dirname(require.resolve('js-yaml')) is dist/, which has no
            // package.json -- deriving the path that way throws.
            const jsYamlVersion = require(
              require.resolve('js-yaml/package.json', { paths: [swaggerDir] }),
            ).version;
            console.log(
              'swagger ok: openapi ' + json.openapi + ', ' + jsonPaths.length + ' paths, ' +
              'js-yaml ' + jsYamlVersion
            );
          "
      - run: npm run test:hard:smoke
      - name: Print API log on hard-smoke failure
        if: failure()
        run: cat /tmp/athr-api.log

  docker-runtime-smoke:
    name: docker-runtime-smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: athr_docker_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d athr_docker_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/athr_docker_smoke
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/athr_docker_smoke
      JWT_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
      # See workspace job above: this job never touches Electron.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run prisma:migrate:deploy
        working-directory: backend
      - name: Build the production image exactly as Railway does
        run: docker build --file backend/Dockerfile --tag athr-api:smoke .
      - name: Run the production image and wait for a healthy response
        run: |
          docker run -d --name athr-api-smoke \
            --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e DIRECT_URL="$DIRECT_URL" \
            -e JWT_SECRET="$JWT_SECRET" \
            -e PORT=3000 \
            athr-api:smoke
          for attempt in {1..30}; do
            curl --silent --fail http://localhost:3000/api/v1/health/ready >/dev/null && exit 0
            sleep 2
          done
          exit 1
      - name: Print container logs
        if: always()
        run: docker logs athr-api-smoke

  release-gate:
    name: release-gate
    if: always() && github.event_name != 'schedule'
    needs:
      - workspace
      - backend
      - migration-gate
      - admin
      - admin-e2e-smoke
      - pos
      - hard-smoke
      - docker-runtime-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Require every production gate
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          WORKSPACE_RESULT: ${{ needs.workspace.result }}
          MIGRATION_RESULT: ${{ needs.migration-gate.result }}
          ADMIN_RESULT: ${{ needs.admin.result }}
          ADMIN_E2E_RESULT: ${{ needs.admin-e2e-smoke.result }}
          POS_RESULT: ${{ needs.pos.result }}
          HARD_SMOKE_RESULT: ${{ needs.hard-smoke.result }}
          DOCKER_RUNTIME_SMOKE_RESULT: ${{ needs.docker-runtime-smoke.result }}
        run: |
          test "$WORKSPACE_RESULT" = "success"
          test "$BACKEND_RESULT" = "success"
          test "$MIGRATION_RESULT" = "success"
          test "$ADMIN_RESULT" = "success"
          test "$ADMIN_E2E_RESULT" = "success"
          test "$POS_RESULT" = "success"
          test "$HARD_SMOKE_RESULT" = "success"
          test "$DOCKER_RUNTIME_SMOKE_RESULT" = "success"
