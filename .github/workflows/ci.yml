name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Root `npm ci` also installs pos-electron's `electron` dependency, whose
# postinstall downloads a ~100MB binary. No job here runs Electron, so skip it.
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run workspace:validate
      - run: npm run test:workspace
      - run: npm run test:shared

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: athr_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d athr_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/athr_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/athr_ci
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/athr_ci_shadow
      JWT_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
      ALLOW_DEVELOPMENT_ACCOUNTING_RESET: reset-development-accounting
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: ${{ github.workspace }}
      - run: npx prisma validate
      # Static guard: nested `create`s must not pass composite-FK columns
      # explicitly, and Prisma write arguments must not be cast to `any`.
      - run: node scripts/check-nested-create-composite-fk.cjs
      # Applied migrations are immutable; schema changes need a new migration.
      - name: Enforce immutable forward-only migrations
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base_sha="$EVENT_BASE_SHA"
          if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          npm run prisma:migrations:policy -- --base "$base_sha"
      - name: Apply migrations to a clean database and check for drift
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host localhost --username postgres athr_ci_shadow
          npx prisma generate
          npx prisma migrate deploy
          npx prisma migrate diff --exit-code \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL"
      - run: npm run prisma:seed
      # Real-Postgres proofs (constraints, triggers, price books, tax codes,
      # promotions, sync snapshot, raw SQL, nested creates). Builds the API.
      - run: npm run test:db
      # Unit/contract specs, typecheck and production build.
      - run: npm run test:soft
      - run: npm audit --audit-level=high

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: ${{ github.workspace }}
      - run: npm run test:soft
      - run: npm audit --audit-level=high

  e2e-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: athr_admin_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d athr_admin_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/athr_admin_smoke
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/athr_admin_smoke
      JWT_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
      ALLOW_DEVELOPMENT_ACCOUNTING_RESET: reset-development-accounting
      ATHR_API_INTERNAL_BASE: http://localhost:3000/api/v1
      ADMIN_SMOKE_PHONE: "+200100000000"
      ADMIN_SMOKE_PASSWORD: Bold1234
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: ${{ github.workspace }}
      - run: npx prisma migrate deploy
        working-directory: backend
      - run: npm run prisma:seed
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: npm run build
        working-directory: admin-web
      - name: Start Backend and Admin
        run: |
          npm --prefix backend run start:prod > /tmp/athr-api.log 2>&1 &
          npm --prefix admin-web run start > /tmp/athr-admin.log 2>&1 &
          for attempt in {1..30}; do
            curl --silent --fail http://localhost:3000/api/v1/health/ready >/dev/null \
              && curl --silent --fail http://localhost:3001/login >/dev/null \
              && exit 0
            sleep 1
          done
          cat /tmp/athr-api.log
          cat /tmp/athr-admin.log
          exit 1
      - run: npm run test:e2e:smoke
        working-directory: admin-web

  pos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos-electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: ${{ github.workspace }}
      - run: npm run test:soft
      - run: npm audit --audit-level=high

  # Builds the production image once, exactly as Railway does, and proves the
  # container boots against a migrated database and answers its health check.
  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: athr_docker_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d athr_docker_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/athr_docker_smoke
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/athr_docker_smoke
      JWT_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run prisma:migrate:deploy
        working-directory: backend
      - run: docker build --file backend/Dockerfile --tag athr-api:${{ github.sha }} .
      - name: Run the production image and wait for a healthy response
        run: |
          docker run -d --name athr-api-smoke \
            --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e DIRECT_URL="$DIRECT_URL" \
            -e JWT_SECRET="$JWT_SECRET" \
            -e PORT=3000 \
            athr-api:${{ github.sha }}
          for attempt in {1..30}; do
            curl --silent --fail http://localhost:3000/api/v1/health/ready >/dev/null && exit 0
            sleep 2
          done
          exit 1
      - name: Print container logs
        if: always()
        run: docker logs athr-api-smoke

  release-gate:
    if: always()
    needs: [workspace, backend, admin, e2e-smoke, pos, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            test "$result" = "success"
          done
