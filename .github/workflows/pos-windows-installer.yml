name: POS Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - pos-rc
    paths:
      - "pos-electron/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/pos-windows-installer.yml"
  pull_request:
    branches:
      - master
    paths:
      - "pos-electron/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/pos-windows-installer.yml"

permissions:
  contents: read

concurrency:
  group: pos-windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: pos-electron

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ github.workspace }}

      - name: Build application
        run: npm run build

      - name: Build Windows installer
        run: npm run dist

      - name: Show generated files
        shell: bash
        run: find release -type f -printf '%p %s bytes\n'

      # The upload step below is skipped on pull_request runs, so it can no
      # longer be what proves electron-builder actually emitted an installer.
      # This assertion runs on every event and keeps a silently empty `dist`
      # (renamed product, changed directories.output, partial pack) red.
      - name: Verify the installer was produced
        shell: bash
        run: |
          shopt -s nullglob
          installers=(release/*.exe)
          if (( ${#installers[@]} == 0 )); then
            echo "::error::npm run dist finished but produced no .exe in pos-electron/release"
            exit 1
          fi
          ls -l "${installers[@]}"

      # A ~102 MB installer on every pull_request run exhausted the
      # account-level Actions artifact storage quota, which then failed the
      # upload and turned green builds red. The binary is only needed when
      # someone is about to install it on the POS laptop, so keep the copy for
      # the two events that mean "I want to run this": a manual
      # workflow_dispatch on any branch, and a push to the pos-rc branch.
      # Pull requests still build and still fail on a broken installer.
      - name: Upload Windows installer
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/pos-rc' }}
        uses: actions/upload-artifact@v4
        with:
          name: athr-pos-windows-${{ github.sha }}
          path: |
            pos-electron/release/*.exe
            pos-electron/release/*.blockmap
            pos-electron/release/latest*.yml
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Explain the skipped upload
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          {
            echo "## Installer built, artifact not kept"
            echo
            echo "The installer built successfully. Pull request runs do not"
            echo "upload it, because a ~102 MB artifact per run exhausts the"
            echo "Actions storage quota."
            echo
            echo "To get an installable build from this branch:"
            echo "**Actions -> POS Windows Installer -> Run workflow ->"
            echo "Branch: \`${{ github.head_ref }}\` -> Run workflow**."
            echo "The artifact appears on that run and is kept for 7 days."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload effective builder config on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: athr-pos-builder-debug-${{ github.sha }}
          path: pos-electron/release/builder-effective-config.yaml
          if-no-files-found: ignore
          retention-days: 7
