name: Hard Load

# Extracted from ci.yml (WP-P1): hard-load has no `needs:` and is not in
# release-gate's `needs:` list, so it was already independent -- it just
# lived inside a 10-job workflow, which meant every workflow_dispatch aimed
# at this job alone billed for all 10 (~30 min) instead of just this one
# (~4 min). Same triggers, same env, same service, same steps as before.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *'

concurrency:
  group: hard-load-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hard-load:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: athr_perf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d athr_perf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/athr_perf
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/athr_perf
      JWT_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
      ALLOW_DEVELOPMENT_ACCOUNTING_RESET: reset-development-accounting
      PERF_LOGIN_PHONE: "+200100000000"
      PERF_LOGIN_PASSWORD: Bold1234
      PERF_CONCURRENCY: 25
      PERF_REQUESTS_PER_WORKER: 20
      PERF_READ_P95_MS: 300
      PERF_PRODUCTS: 10000
      PERF_INVOICES: 50000
      PERF_MUTATIONS: 1
      PERF_SALES: 100
      PERF_SALE_P95_MS: 500
      # WP-P1 H1 measurement: baseline value under test. Changed commit-by-commit
      # (1 / 20 / 100) while gathering evidence; see the PR for the run IDs and
      # numbers at each value before this settles on its final default.
      PERF_SALE_VARIANTS: 20
      # WP-P1 H2: env-gated event-loop-delay + CPU sampler (see
      # src/config/runtime-diagnostics.ts). No effect outside this job.
      PERF_DIAGNOSTICS: "1"
      PERF_CASHIER_PHONE: "+200100000002"
      PERF_CASHIER_PASSWORD: Bold1234
      # Root `npm ci` installs pos-electron's `electron` dependency too, whose
      # postinstall downloads a ~100MB platform binary over the network. This
      # job never touches Electron -- skip it.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: ${{ github.workspace }}
      - run: npx prisma migrate deploy
      - run: npm run prisma:seed
      - run: npm run perf:seed
      - run: npm run build
      - name: Start API
        run: |
          npm run start:prod > /tmp/athr-api.log 2>&1 &
          for attempt in {1..30}; do
            curl --silent --fail http://localhost:3000/api/v1/health/ready >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/athr-api.log
          exit 1
      - run: npm run test:hard
      # WP-P1 Phase A: the query-plan evidence the WP requires, plus the
      # concurrency-1 page=500 sample the harness never takes. Deliberately
      # placed *after* test:hard and gated on `always()`: running it first
      # would warm the very caches whose cost it is measuring, and it has to
      # run even though test:hard exits non-zero on the p95 breach.
      - name: WP-P1 diagnostic -- product pagination query plans (read-only)
        if: always()
        run: node scripts/diagnose-product-pagination.cjs
      - name: Print API log
        if: always()
        run: cat /tmp/athr-api.log
